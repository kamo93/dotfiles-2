unbind-key C-b
set -g prefix 'C-n'
bind-key 'C-n' send-prefix
# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on
set-option -g renumber-windows on

# Enable RGB color if running in xterm(1)
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"
set-option -ga terminal-overrides ",xterm-kitty:Tc"

# enable italics according to https://github.com/tmux/tmux/wiki/FAQ#i-dont-see-italics-or-italics-and-reverse-are-the-wrong-way-round
set -g default-terminal "tmux"

set -g status-keys vi
set -g history-limit 30000
set-option -g mouse on
setw -g mode-keys vi
setw -g monitor-activity on
set-option -s set-clipboard off
bind P paste-buffer

# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X rectangle-toggle
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection -x
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -se c -i'
# bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -se c -i'


# ======================== Copy clipboard macos ===========================
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Yank a clipboard (pbcopy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Mouse selection -> clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Si quieres mantener rectangle-toggle, ponlo en otra tecla
bind-key -T copy-mode-vi r send-keys -X rectangle-togglebind-key -T copy-mode-vi v send-keys -X begin-selection

# Yank a clipboard (pbcopy)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Mouse selection -> clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Si quieres mantener rectangle-toggle, ponlo en otra tecla
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
# ======================== Copy clipboard macos ===========================

# # tmux yank mappings with clear-selection
# bind-key -T copy-mode y send-keys -X copy-pipe "reattach-to-user-namespace pbcopy" \; send-keys -X clear-selection
# bind-key -T copy-mode Y send-keys -X copy-pipe-and-cancel "tmux paste-buffer"
# bind-key -T copy-mode-vi y send-keys -X copy-pipe "reattach-to-user-namespace pbcopy" \; send-keys -X clear-selection
# bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "tmux paste-buffer"

# bell notification disable so alacritty doesnt bounce
set -g bell-action none
set -g visual-bell off
set -g monitor-bell off

bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

bind-key -r J resize-pane -D 10
bind-key -r K resize-pane -U 10
bind-key -r H resize-pane -L 10
bind-key -r L resize-pane -R 10

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind-key h select-pane -L
bind-key j select-pane -D 
bind-key k select-pane -U
bind-key l select-pane -R

# Alt h - j to move throws windows
bind-key -n M-h previous-window
bind-key -n M-l next-window

# Move window position manually by one position
# Swap window to the left
# bind -n C-M-h swap-window -t -1
# bind -n C-M-h run-shell 'tmux move-window -t -1; tmux select-window -t !'
# Swap window to the right
# bind -n C-M-l swap-window -t +1

# change split pace position

# Use Alt-vim keys without prefix key to switch pans
# bind -n M-k select-pane -U
# bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# Shift arrow to switch windows
# bind -n S-Left  previous-window
# bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
# bind r source-file ~/.tmux.conf

set-option -g focus-events on

# THEME
set -g status-bg black
set -g status-fg white
set -g status-interval 60
set -g status-left-length 30
set -g status-left '#[fg=green](#S) #(whoami)'
set -g status-right '#[fg=yellow]#(cut -d " " -f 1-3 /proc/loadavg)#[default] #[fg=white]%H:%M#[default]'

# Undercurl
# set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# scroll copy mode plugin conf tmux-better-mouse-mode
set -g @scroll-speed-num-lines-per-scroll 20

# yank tmux
set -g @yank_action 'copy-pipe'

# Set a faster mouse scroll speed in tmux
# set -g mouse-scroll-speed 20
#list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
#set -g @plugin 'egel/tmux-gruvbox'
#set -g @tmux-grubox 'dark'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'sei40kr/tmux-onedark'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# for tmux-yank work correctly this reattach works for mac 
# https://github.com/tmux-plugins/tmux-yank#requirements
# requirements for other OS
 # set-option -g default-command "reattach-to-user-namespace -l zsh"


